[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# (Sin catch-all manual: con output hybrid el adaptador de Netlify enruta las
#  rutas SSR (/infografia/*, /sitemap-infografias.xml) a su función. Un
#  redirect /* → /404 en netlify.toml las tragaría. Astro sirve su 404.html
#  para lo no encontrado.)

# Headers de seguridad y performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
